<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<title>Scoreboard</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@700;800;900&family=Rubik:ital,wght@1,900&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #ff2d55;
    --red-soft: #ff6b81;
    --blue: #1e90ff;
    --blue-soft: #6fd3ff;
    --gold: #f5c542;
    --panel: #14161f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; user-select: none; }
  body {
    font-family: "Heebo", sans-serif;
    display: flex;
    justify-content: center;
    padding-top: 20px;
  }

  .board {
    position: relative;
    display: flex;
    align-items: center;
    width: 1500px;
    height: 170px;
  }

  /* ---------- side panels ---------- */
  .side {
    position: relative;
    flex: 1;
    height: 130px;
    display: flex;
    align-items: center;
    padding: 0 40px;
    background: linear-gradient(180deg, #1c1f2b 0%, var(--panel) 100%);
    border-radius: 16px;
    cursor: pointer;
  }
  .side.red {
    border: 3px solid var(--red);
    box-shadow: 0 0 18px rgba(255, 45, 85, .55), inset 0 0 30px rgba(255, 45, 85, .18);
    padding-right: 150px;
  }
  .side.blue {
    border: 3px solid var(--blue);
    box-shadow: 0 0 18px rgba(30, 144, 255, .55), inset 0 0 30px rgba(30, 144, 255, .18);
    padding-left: 150px;
    flex-direction: row-reverse;
  }

  .score {
    font-family: "Heebo", sans-serif;
    font-weight: 900;
    font-size: 104px;
    line-height: 1;
    min-width: 110px;
    text-align: center;
    transition: transform .15s ease;
  }
  .red  .score { color: var(--red-soft);  text-shadow: 0 0 16px rgba(255, 45, 85, .7); }
  .blue .score { color: var(--blue-soft); text-shadow: 0 0 16px rgba(30, 144, 255, .7); }
  .score.bump { transform: scale(1.18); }

  .names {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .red  .names { align-items: flex-end; text-align: right; }
  .blue .names { align-items: flex-start; text-align: left; }

  .name-he {
    direction: rtl;
    font-weight: 900;
    font-size: 50px;
    line-height: 1.05;
    color: #fff;
    white-space: nowrap;
  }
  .name-en {
    font-weight: 800;
    font-size: 22px;
    letter-spacing: 2px;
    color: #c9ccd6;
    text-transform: uppercase;
    white-space: nowrap;
  }

  /* ---------- center hexagon ---------- */
  .center {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 300px;
    height: 170px;
    z-index: 2;
  }
  .hex, .hex-inner {
    position: absolute;
    clip-path: polygon(16% 0, 84% 0, 100% 50%, 84% 100%, 16% 100%, 0 50%);
  }
  .hex {
    inset: 0;
    background: linear-gradient(180deg, #ffd865, #b8871d);
  }
  .hex-inner {
    inset: 5px 6px;
    background: radial-gradient(ellipse at 50% 35%, #1b2550 0%, #0b1030 70%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }
  .prize {
    font-weight: 900;
    font-size: 44px;
    line-height: 1;
    color: var(--gold);
    text-shadow: 0 0 12px rgba(245, 197, 66, .6);
  }
  .vs {
    font-family: "Rubik", sans-serif;
    font-style: italic;
    font-weight: 900;
    font-size: 64px;
    line-height: 1;
    color: #fff;
    text-shadow: -3px 0 0 var(--red), 3px 0 0 var(--blue), 0 0 14px rgba(255,255,255,.35);
  }

  /* ---------- help (hidden in OBS unless ?help) ---------- */
  .help {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,.8);
    color: #fff;
    font-size: 16px;
    padding: 10px 18px;
    border-radius: 10px;
    direction: rtl;
    display: none;
    text-align: center;
    line-height: 1.6;
  }
  body.show-help .help { display: block; }
</style>
</head>
<body>

<div class="board">
  <div class="side red" data-team="red">
    <div class="score" id="score-red">0</div>
    <div class="names">
      <div class="name-he">דוד טור</div>
      <div class="name-en">Devidtur</div>
    </div>
  </div>

  <div class="center">
    <div class="hex"></div>
    <div class="hex-inner">
      <div class="prize">$15</div>
      <div class="vs">VS</div>
    </div>
  </div>

  <div class="side blue" data-team="blue">
    <div class="score" id="score-blue">0</div>
    <div class="names">
      <div class="name-he">מיכאל IGZ</div>
      <div class="name-en">IGZ</div>
    </div>
  </div>
</div>

<div class="help">
  קליק שמאלי על צד = ‎+1 · קליק ימני = ‎−1<br>
  אדום: Q (+) / A (−) · כחול: P (+) / L (−) · R = איפוס
</div>

<script>
  const KEY = "obs-scoreboard-v1";
  let state = { red: 0, blue: 0 };
  try { state = Object.assign(state, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) {}

  if (new URLSearchParams(location.search).has("help")) document.body.classList.add("show-help");

  function render(team) {
    for (const t of ["red", "blue"]) {
      const el = document.getElementById("score-" + t);
      el.textContent = state[t];
      if (t === team) {
        el.classList.add("bump");
        setTimeout(() => el.classList.remove("bump"), 150);
      }
    }
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  function change(team, delta) {
    state[team] = Math.max(0, state[team] + delta);
    render(team);
  }

  document.querySelectorAll(".side").forEach(side => {
    const team = side.dataset.team;
    side.addEventListener("click", () => change(team, 1));
    side.addEventListener("contextmenu", e => { e.preventDefault(); change(team, -1); });
  });

  document.addEventListener("keydown", e => {
    const k = e.key.toLowerCase();
    if (k === "q") change("red", 1);
    else if (k === "a") change("red", -1);
    else if (k === "p") change("blue", 1);
    else if (k === "l") change("blue", -1);
    else if (k === "r") { state.red = 0; state.blue = 0; render(); }
  });

  render();
</script>
</body>
</html>
