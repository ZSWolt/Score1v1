<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<title>Scoreboard</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,800;1,800&family=Heebo:wght@800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #e5383b;
    --red-dark: #b3202a;
    --blue: #2f6fed;
    --blue-dark: #1c4fc0;
    --gold: #f0b93a;
    --plate: #16181e;
    --plate-2: #1e2129;
    --ink: #0c0d11;
    --muted: #8e93a3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; user-select: none; }
  body {
    font-family: "Barlow Condensed", "Heebo", sans-serif;
    display: flex;
    justify-content: center;
    padding: 20px 0 40px;
  }

  .board {
    display: grid;
    grid-template-columns: 1fr 210px 1fr;
    align-items: start;
    width: 1500px;
    filter: drop-shadow(0 10px 22px rgba(0, 0, 0, .45));
  }

  /* ---------- teams ---------- */
  .team {
    display: flex;
    height: 100px;
    cursor: pointer;
  }
  .team.red  { clip-path: polygon(34px 0, 100% 0, 100% 100%, 0 100%); }
  .team.blue { clip-path: polygon(0 0, calc(100% - 34px) 0, 100% 100%, 0 100%); flex-direction: row-reverse; }

  .score {
    position: relative;
    width: 170px;
    display: grid;
    place-items: center;
    overflow: hidden;
    color: #fff;
    font-weight: 800;
    font-size: 92px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .red  .score { background: linear-gradient(180deg, var(--red) 0%, var(--red-dark) 100%); padding-left: 24px; }
  .blue .score { background: linear-gradient(180deg, var(--blue) 0%, var(--blue-dark) 100%); padding-right: 24px; }
  .score span { display: block; }
  .score.bump span { animation: pop .35s cubic-bezier(.2, .8, .3, 1.2); }
  .score::after {
    content: "";
    position: absolute;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
  }
  .score.bump::after { animation: flash .4s ease-out; }
  @keyframes pop   { from { transform: translateY(40%); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes flash { from { opacity: .45; } to { opacity: 0; } }

  .plate {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
    padding: 0 32px;
    background: linear-gradient(180deg, var(--plate-2) 0%, var(--plate) 100%);
  }
  .plate::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 5px;
  }
  .red  .plate::after { background: var(--red); }
  .blue .plate::after { background: var(--blue); }
  .red  .plate { align-items: flex-end; text-align: right; }
  .blue .plate { align-items: flex-start; text-align: left; }

  .name-he {
    direction: rtl;
    font-family: "Heebo", sans-serif;
    font-weight: 900;
    font-size: 44px;
    line-height: 1.1;
    color: #fff;
    white-space: nowrap;
  }
  .name-en {
    font-weight: 600;
    font-size: 21px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
  }

  /* ---------- center ---------- */
  .center {
    position: relative;
    height: 128px;
    background: var(--ink);
    clip-path: polygon(0 0, 100% 0, 88% 100%, 12% 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding-top: 6px;
  }
  .center::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: var(--gold);
  }
  .vs {
    font-style: italic;
    font-weight: 800;
    font-size: 58px;
    line-height: .9;
    letter-spacing: 1px;
    color: #fff;
  }
  .prize {
    font-weight: 800;
    font-size: 30px;
    line-height: 1;
    letter-spacing: 1px;
    color: var(--ink);
    background: var(--gold);
    padding: 5px 18px 4px;
    border-radius: 4px;
  }

  /* ---------- help (only with ?help) ---------- */
  .help {
    position: fixed;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, .8);
    color: #fff;
    font-family: "Heebo", sans-serif;
    font-size: 15px;
    padding: 10px 18px;
    border-radius: 8px;
    direction: rtl;
    display: none;
    text-align: center;
    line-height: 1.6;
  }
  body.show-help .help { display: block; }
</style>
</head>
<body>

<div class="board">
  <div class="team red" data-team="red">
    <div class="score" id="score-red"><span>0</span></div>
    <div class="plate">
      <div class="name-he">דוד טור</div>
      <div class="name-en">Devidtur</div>
    </div>
  </div>

  <div class="center">
    <div class="vs">VS</div>
    <div class="prize">$15</div>
  </div>

  <div class="team blue" data-team="blue">
    <div class="score" id="score-blue"><span>0</span></div>
    <div class="plate">
      <div class="name-he">מיכאל IGZ</div>
      <div class="name-en">IGZ</div>
    </div>
  </div>
</div>

<div class="help">
  קליק שמאלי על צד = ‎+1 · קליק ימני = ‎−1<br>
  אדום: Q (+) / A (−) · כחול: P (+) / L (−) · R = איפוס
</div>

<script>
  const KEY = "obs-scoreboard-v1";
  let state = { red: 0, blue: 0 };
  try { state = Object.assign(state, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) {}

  if (new URLSearchParams(location.search).has("help")) document.body.classList.add("show-help");

  function render(team) {
    for (const t of ["red", "blue"]) {
      const el = document.getElementById("score-" + t);
      el.firstElementChild.textContent = state[t];
      if (t === team) {
        el.classList.remove("bump");
        void el.offsetWidth;
        el.classList.add("bump");
      }
    }
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  function change(team, delta) {
    const next = Math.max(0, state[team] + delta);
    if (next === state[team]) return;
    state[team] = next;
    render(team);
  }

  document.querySelectorAll(".team").forEach(side => {
    const team = side.dataset.team;
    side.addEventListener("click", () => change(team, 1));
    side.addEventListener("contextmenu", e => { e.preventDefault(); change(team, -1); });
  });

  document.addEventListener("keydown", e => {
    const k = e.key.toLowerCase();
    if (k === "q") change("red", 1);
    else if (k === "a") change("red", -1);
    else if (k === "p") change("blue", 1);
    else if (k === "l") change("blue", -1);
    else if (k === "r") { state.red = 0; state.blue = 0; render(); }
  });

  render();
</script>
</body>
</html>
